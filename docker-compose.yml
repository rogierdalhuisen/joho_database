services:
  # Django Web Application Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expat_insurance_web
    command: python src/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_HOST=${DB_HOST}
      - POSTGRES_PORT=${DB_PORT}
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - .env

  # PostgreSQL Database Service
  #in production use nginx
  db:
    image: postgres:16
    container_name: expat_insurance_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Optional: Performance tuning
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"  # Host:Container port mapping
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persistent data storage
      - ./docker/db_init:/docker-entrypoint-initdb.d  # Initialization scripts
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Metabase Business Intelligence Service
  metabase:
    image: metabase/metabase:latest
    container_name: expat_insurance_metabase
    ports:
      - "3000:3000"  # Metabase web interface
    environment:
      # Use PostgreSQL for Metabase's internal database (more stable than H2)
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${DB_NAME}
      MB_DB_PORT: 5432
      MB_DB_USER: ${DB_USER}
      MB_DB_PASS: ${DB_PASSWORD}
      MB_DB_HOST: db
      MB_EMOJI_IN_LOGS: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  shared_network:
    name: shared_db_network
    driver: bridge

volumes:
  postgres_data:
    driver: local
